# Alembic config for the AI Manager Platform backend.
# The DSN is sourced from .env (DATABASE_URL) via app.settings.
# Run: cd backend && alembic upgrade head
# First-time sync (M1 migrations applied via Supabase MCP already):
#   cd backend && alembic stamp head

[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
